# =============================================================================
# OTIN CARWASH — server block nginx (Windows)
#
# Disalin ke:  C:\nginx\conf\conf.d\otin-carwash.conf
# Aktifkan dengan menambahkan baris ini di dalam blok http { } pada
# C:\nginx\conf\nginx.conf :
#     include conf.d/*.conf;
#
# Catatan Windows: php-fpm TIDAK ADA di Windows. Padanannya php-cgi.exe yang
# dijalankan sebagai FastCGI listener. Karena satu proses php-cgi hanya
# melayani satu permintaan pada satu waktu, dijalankan DUA proses (port
# 9000 & 9001) supaya panggilan API yang paralel tidak antre.
# =============================================================================

upstream otin_php {
    server 127.0.0.1:9000;
    server 127.0.0.1:9001;
    keepalive 8;
}

server {
    listen       8080;
    server_name  localhost;

    # Hanya folder public/ yang boleh dilihat dunia luar.
    # File .env, folder storage/, dan vendor/ ada DI LUAR sini — jangan
    # sekali-kali mengarahkan root ke folder proyek.
    root  C:/xampp/htdocs/otin-carwash/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;

    # Cloudflare Tunnel menyambung dari mesin ini juga, jadi log akses
    # lokal tetap berguna untuk menelusuri masalah.
    access_log logs/otin-access.log;
    error_log  logs/otin-error.log warn;

    # --- Keamanan dasar -------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "same-origin"    always;

    # --- Laravel front controller ---------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset statis: cache lama, tapi kasir.css & kasir.js sudah pakai
    # ?v=filemtime() sehingga perubahan tetap langsung terlihat.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;                     # cegah path info injection
        fastcgi_pass  otin_php;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;

        # Ekspor CSV & laporan bulan panjang bisa lebih dari 60 detik default.
        fastcgi_read_timeout 180;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Jangan pernah menyajikan file titik (.env, .git, .htaccess, dsb).
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

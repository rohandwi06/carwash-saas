# =============================================================================
# OTIN CARWASH - VirtualHost Apache untuk aplikasi kasir
#
# Berkas ini TIDAK disalin ke folder XAMPP. Apache cukup diarahkan ke sini
# supaya konfigurasinya ikut terversi di git. Tambahkan satu baris di paling
# bawah C:\xampp\apache\conf\httpd.conf :
#
#   Include "C:/xampp/htdocs/otin-carwash/deploy/windows/apache/otin-carwash.conf"
#
# Port 8080 dipakai, bukan 80, supaya site bawaan XAMPP (phpMyAdmin dsb.)
# tetap hidup di port 80 dan tidak ikut terbuka lewat tunnel.
# =============================================================================

Listen 8080

<VirtualHost *:8080>
    # Hanya folder public/ yang tersaji. File .env, storage/, dan vendor/
    # berada DI LUAR sini - jangan pernah mengarahkan DocumentRoot ke akar
    # folder proyek.
    DocumentRoot "C:/xampp/htdocs/otin-carwash/public"

    <Directory "C:/xampp/htdocs/otin-carwash/public">
        # AllowOverride All wajib: routing Laravel bergantung pada
        # public/.htaccess bawaannya.
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Jangan sajikan berkas titik (.env, .git, .htaccess) walau salah taruh.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
    </IfModule>

    ErrorLog  "C:/xampp/htdocs/otin-carwash/storage/logs/apache-error.log"
    CustomLog "C:/xampp/htdocs/otin-carwash/storage/logs/apache-access.log" combined
</VirtualHost>
